<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Signal bar reads DONE, tests pass, 200 OK. Receipt bar shows 60 percent green and 40 percent red under a veil.">
  <rect width="480" height="300" fill="#04090c"/>
  <text x="24" y="40" fill="#dce8e6" font-family="monospace" font-size="15">SIGNAL</text>
  <rect x="24" y="54" width="432" height="44" rx="6" fill="#123a3a"/>
  <rect x="24" y="54" width="432" height="44" rx="6" fill="none" stroke="#6ee7d8" stroke-width="1.5"/>
  <text x="40" y="82" fill="#6ee7d8" font-family="monospace" font-size="16">DONE · tests pass · 200 OK</text>
  <text x="24" y="140" fill="#dce8e6" font-family="monospace" font-size="15">RECEIPT</text>
  <rect x="24" y="154" width="432" height="44" rx="6" fill="#123a3a"/>
  <rect x="24" y="154" width="259" height="44" rx="6" fill="#2f7d5f"/>
  <rect x="283" y="154" width="173" height="44" rx="6" fill="#8a3d2e"/>
  <rect x="24" y="154" width="432" height="44" rx="6" fill="rgba(220,232,230,0.10)"/>
  <rect x="24" y="154" width="432" height="44" rx="6" fill="none" stroke="#6ee7d8" stroke-width="1.5"/>
  <text x="40" y="182" fill="#dce8e6" font-family="monospace" font-size="16">60% read back</text>
  <text x="24" y="240" fill="#9db4ae" font-family="monospace" font-size="13">Signal said 100 percent. Receipt says 60 percent.</text>
  <text x="24" y="262" fill="#6f8a83" font-family="monospace" font-size="12">A green signal is not a receipt.</text>
</svg>
